<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Respect • Tieneravond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Patrick Hand', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0a0a16;
    color: #ececf5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    font-size: 17px;
    letter-spacing: .2px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,.25), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,92,168,.18), transparent 45%);
    pointer-events: none; z-index: 0;
  }

  /* ============ ALGEMEEN ============ */
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select { font-family: inherit; }

  /* ============ LOGIN ============ */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: rgba(26,26,46,.85);
    border: 1px solid rgba(124,92,255,.35);
    border-radius: 24px;
    padding: 40px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 60px rgba(124,92,255,.15);
    text-align: center;
    animation: cardIn .5s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .login-card h1 {
    font-family: 'Caveat', cursive;
    font-size: 60px; font-weight: 700; line-height: 1;
    background: linear-gradient(135deg, #7c5cff 0%, #ff5ca8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .login-card .sub { color: #8888a8; font-size: 15px; margin-bottom: 32px; }
  .btn {
    display: block; width: 100%;
    padding: 16px; border-radius: 14px;
    font-size: 18px; font-weight: 400;
    transition: transform .15s, box-shadow .15s, background .15s;
    margin-bottom: 12px;
    letter-spacing: .3px;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white;
    box-shadow: 0 8px 24px rgba(124,92,255,.4);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(124,92,255,.55); }
  .btn-secondary {
    background: rgba(255,255,255,.06);
    color: #ececf5;
    border: 1px solid rgba(255,255,255,.12);
  }
  .btn-secondary:hover { background: rgba(255,255,255,.1); }
  #nameInput {
    width: 100%; padding: 16px;
    background: rgba(0,0,0,.35);
    border: 2px solid rgba(124,92,255,.3);
    border-radius: 14px;
    color: white; font-size: 22px; font-weight: 400;
    text-align: center; margin-bottom: 12px;
    outline: none; transition: border .2s;
  }
  #nameInput:focus { border-color: #7c5cff; }
  #nameInput::placeholder { color: #55557a; font-weight: 400; }

  /* ============ APP LAYOUT ============ */
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
  .app-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: rgba(10,10,22,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(124,92,255,.15);
    gap: 12px;
  }
  .logo {
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 26px; line-height: 1;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #screenTitle { font-size: 14px; color: #8888a8; font-weight: 400; flex: 1; text-align: center; }
  .pill {
    background: rgba(124,92,255,.18);
    border: 1px solid rgba(124,92,255,.35);
    color: #b8a8ff;
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 400;
    white-space: nowrap;
  }

  main {
    flex: 1;
    padding: 24px 18px 160px;
    max-width: 900px; margin: 0 auto; width: 100%;
  }

  /* ============ HERO / WELKOM ============ */
  .hero { text-align: center; padding: 40px 0 20px; animation: fadeUp .6s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: none; }
  }
  .hero-title {
    font-family: 'Caveat', cursive;
    font-size: clamp(80px, 20vw, 160px);
    font-weight: 700; line-height: .9;
    background: linear-gradient(135deg, #7c5cff 0%, #ff5ca8 60%, #ffb85c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }
  .hero-sub {
    font-family: 'Caveat', cursive;
    font-size: clamp(24px, 5vw, 34px);
    color: #b8a8ff; font-weight: 500; margin-bottom: 32px; line-height: 1.1;
  }
  .hero-text {
    font-size: 18px; line-height: 1.6; color: #c8c8dc;
    max-width: 560px; margin: 0 auto 20px;
  }
  .hero-hint {
    display: inline-block;
    background: rgba(124,92,255,.12);
    border: 1px solid rgba(124,92,255,.3);
    padding: 14px 20px; border-radius: 16px;
    font-size: 15px; color: #b8a8ff; line-height: 1.5;
    margin-top: 20px; max-width: 460px;
  }

  /* ============ TANDPASTA ============ */
  .tandpasta-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 20px 0;
    animation: fadeUp .6s ease;
  }
  .tandpasta-stage img {
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(124,92,255,.2);
    border: 2px solid rgba(124,92,255,.25);
  }
  .tandpasta-stage .photo-fallback {
    position: static;
    font-size: 160px;
  }

  /* ============ YOUTUBE EMBED ============ */
  .video-embed {
    position: relative;
    width: 100%;
    max-width: 380px;
    margin: 0 auto 24px;
    aspect-ratio: 9/16;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(124,92,255,.3);
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(124,92,255,.15);
    background: #000;
  }
  .video-embed iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .video-embed.wide {
    aspect-ratio: 16/9;
    max-width: 340px;
  }
  .video-intro {
    font-size: 18px;
    line-height: 1.55;
    color: #c8c8dc;
    max-width: 560px;
    margin: 0 auto 24px;
    text-align: center;
  }

  /* ============ SCHERM KOP ============ */
  .screen-h {
    font-family: 'Caveat', cursive;
    font-size: clamp(42px, 9vw, 66px);
    font-weight: 700;
    margin-bottom: 6px; line-height: 1.05;
  }
  .screen-h em {
    font-style: normal;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .screen-intro {
    font-size: 17px; line-height: 1.55; color: #a8a8c0;
    margin-bottom: 28px; max-width: 640px;
  }

  /* ============ FOTO'S (één per keer) ============ */
  .photo-stage {
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .photo-slide {
    display: flex; flex-direction: column; gap: 20px;
    width: 100%; max-width: 520px;
    animation: fadeUp .4s ease;
  }
  .photo-slide.hidden { display: none !important; }
  .photo-card {
    background: rgba(26,26,46,.7);
    border: 1px solid rgba(124,92,255,.2);
    border-radius: 20px;
    overflow: hidden;
    transition: border-color .3s;
    width: 100%;
  }
  .photo-card.revealed { border-color: rgba(124,92,255,.6); }
  .photo-wrap {
    position: relative; aspect-ratio: 1/1;
    background: linear-gradient(135deg, #1a1a2e, #2a1a4e);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-fallback {
    font-family: 'Caveat', cursive;
    font-size: 140px; font-weight: 700; color: rgba(124,92,255,.35);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  .photo-name {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,.95), transparent);
    padding: 40px 16px 14px;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 28px; color: #fff;
    opacity: 0; transition: opacity .4s;
  }
  .photo-card.revealed .photo-name { opacity: 1; }
  .photo-info {
    padding: 14px 18px; font-size: 15px; color: #a8a8c0; line-height: 1.5;
    max-height: 0; overflow: hidden;
    transition: max-height .5s ease, padding .3s ease;
  }
  .photo-card.revealed .photo-info {
    max-height: 200px;
    padding: 14px 18px;
  }
  .photo-card:not(.revealed) .photo-info { padding: 0 18px; }
  .leader-reveal-hint {
    display: block; text-align: center; font-size: 12px; color: #7c5cff;
    padding: 12px; font-weight: 400; letter-spacing: .5px; text-transform: uppercase;
    cursor: pointer; background: rgba(124,92,255,.08);
    border-top: 1px solid rgba(124,92,255,.15);
    transition: background .2s;
  }
  .leader-reveal-hint:hover { background: rgba(124,92,255,.18); }
  body:not(.is-leader) .leader-reveal-hint { display: none; }
  .photo-dots {
    display: flex; justify-content: center; gap: 8px; margin-top: -8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(124,92,255,.25);
    transition: all .3s;
  }
  .dot.active {
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    width: 26px; border-radius: 4px;
  }

  /* ============ BIJBELTEKST ============ */
  .bible-card {
    background: linear-gradient(180deg, rgba(26,26,46,.9), rgba(20,20,38,.9));
    border: 1px solid rgba(124,92,255,.25);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .bible-card::before {
    content: "✝";
    position: absolute; top: -30px; right: -10px;
    font-size: 200px; color: rgba(124,92,255,.06);
    font-weight: 700;
  }
  .bible-ref {
    display: inline-block;
    font-family: 'Caveat', cursive;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white; font-weight: 700; font-size: 20px;
    padding: 4px 16px; border-radius: 999px;
    margin-bottom: 18px; line-height: 1.2;
  }
  .bible-text {
    font-size: 19px; line-height: 1.7; color: #d8d8e8;
    position: relative; z-index: 1;
    max-height: 55vh; overflow-y: auto;
    padding-right: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,92,255,.4) transparent;
  }
  .bible-text::-webkit-scrollbar { width: 6px; }
  .bible-text::-webkit-scrollbar-thumb { background: rgba(124,92,255,.4); border-radius: 3px; }
  .bible-text p { margin-bottom: 14px; }
  .bible-text .verse-num {
    display: inline-block;
    font-family: 'Caveat', cursive;
    color: #7c5cff; font-weight: 700; font-size: 20px;
    vertical-align: super; margin-right: 4px;
  }
  .bible-highlight {
    background: linear-gradient(90deg, rgba(124,92,255,.2), rgba(255,92,168,.1));
    border-left: 3px solid #7c5cff;
    padding: 10px 14px; margin: 14px 0; border-radius: 0 10px 10px 0;
    font-weight: 400; color: #fff;
  }

  /* ============ VRAAG BLOKKEN ============ */
  .q-block {
    background: rgba(26,26,46,.65);
    border: 1px solid rgba(124,92,255,.18);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
    animation: fadeUp .5s ease;
  }
  .q-header {
    display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start;
  }
  .q-num {
    flex-shrink: 0;
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 22px; color: white; line-height: 1;
  }
  .q-text {
    font-size: 17px; line-height: 1.45; font-weight: 400; color: #ececf5;
    padding-top: 4px;
  }
  .q-input-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .q-input-row input {
    flex: 1; min-width: 0;
    padding: 14px 16px;
    background: rgba(0,0,0,.4);
    border: 2px solid rgba(124,92,255,.2);
    border-radius: 14px;
    color: white; font-size: 16px;
    outline: none;
    transition: border .2s;
  }
  .q-input-row input:focus { border-color: #7c5cff; }
  .q-input-row input::placeholder { color: #55557a; }
  .q-send {
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white; border-radius: 14px;
    padding: 0 20px; font-size: 20px; font-weight: 700;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(124,92,255,.3);
  }
  .q-send:active { transform: scale(.93); }
  .q-feed {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 300px; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,92,255,.3) transparent;
  }
  .q-feed::-webkit-scrollbar { width: 5px; }
  .q-feed::-webkit-scrollbar-thumb { background: rgba(124,92,255,.3); border-radius: 3px; }
  .feed-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(124,92,255,.08);
    border: 1px solid rgba(124,92,255,.15);
    border-radius: 12px;
    padding: 10px 12px;
    animation: itemIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes itemIn {
    from { opacity: 0; transform: translateY(-8px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  .feed-name {
    flex-shrink: 0;
    font-family: 'Caveat', cursive;
    font-weight: 700; font-size: 19px; color: #b8a8ff;
    min-width: 54px; line-height: 1.2;
  }
  .feed-name::after { content: ":"; color: #7c5cff; margin-right: 2px; }
  .feed-text { font-size: 15px; line-height: 1.45; color: #d8d8e8; flex: 1; word-break: break-word; padding-top: 2px; }
  .feed-empty { font-size: 14px; color: #55557a; font-style: italic; padding: 6px 2px; }
  .feed-item.mine { background: rgba(255,92,168,.1); border-color: rgba(255,92,168,.3); }
  .feed-item.mine .feed-name { color: #ff8ec0; }

  /* Gebedspunten: geen naam, alleen tekst */
  .feed-item.no-name {
    background: rgba(255,215,100,.08);
    border-color: rgba(255,215,100,.2);
  }
  .feed-item.no-name .feed-text {
    font-size: 15px;
    color: #f0e6c8;
    padding-top: 0;
  }

  /* ============ LIEDJES / BIDDEN ============ */
  .list-card {
    background: rgba(26,26,46,.65);
    border: 1px solid rgba(124,92,255,.18);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .list-card h3 {
    font-family: 'Caveat', cursive;
    font-size: 22px; letter-spacing: .5px;
    color: #7c5cff; font-weight: 700; margin-bottom: 12px; line-height: 1.2;
  }
  .list-card ul { list-style: none; }
  .list-card li {
    padding: 10px 0; border-bottom: 1px solid rgba(124,92,255,.1);
    font-size: 16px; color: #d8d8e8;
  }
  .list-card li:last-child { border-bottom: none; }
  .list-card p { font-size: 16px; line-height: 1.6; color: #c8c8dc; }

  /* ============ LEADER BAR ============ */
  .leader-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 12px;
    background: rgba(10,10,22,.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(124,92,255,.3);
    box-shadow: 0 -8px 32px rgba(0,0,0,.5);
  }
  .leader-row {
    display: flex; align-items: center; gap: 8px;
  }
  .leader-bar button, .leader-bar select, .leader-bar .counter {
    background: rgba(124,92,255,.15);
    border: 1px solid rgba(124,92,255,.3);
    color: #d8d8e8;
    padding: 10px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 400;
    transition: background .15s;
  }
  .leader-bar button:hover, .leader-bar select:hover { background: rgba(124,92,255,.28); }
  .leader-bar button:disabled { opacity: .35; cursor: not-allowed; }
  .leader-bar select { flex: 1; min-width: 0; }
  .leader-bar .danger {
    background: rgba(239,68,68,.15);
    border-color: rgba(239,68,68,.4);
    color: #ff8888;
  }
  .leader-bar .danger:hover { background: rgba(239,68,68,.3); }
  .leader-bar .counter {
    background: transparent; border-color: transparent;
    color: #b8a8ff; font-family: 'Caveat', cursive;
    font-size: 20px; padding: 0 8px;
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: rgba(124,92,255,.95);
    color: white; font-weight: 400; font-size: 15px;
    padding: 12px 22px; border-radius: 999px;
    box-shadow: 0 8px 32px rgba(124,92,255,.5);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ============ MOBIEL ============ */
  @media (max-width: 500px) {
    main { padding: 18px 14px 180px; }
    .app-header { padding: 10px 14px; }
    #screenTitle { display: none; }
    .q-block { padding: 16px; }
    .bible-card { padding: 18px; }
    .bible-text { font-size: 17px; line-height: 1.65; }
    .leader-bar button { padding: 8px 10px; font-size: 13px; }
    .video-embed { max-width: 100%; }
    .tandpasta-stage img { max-height: 60vh; border-radius: 16px; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <h1>Respect</h1>
    <p class="sub">Tieneravond • Jakobus 3:5–12</p>
    <div id="roleChoice">
      <button class="btn btn-primary" data-role="deelnemer">Ik doe mee als deelnemer</button>
      <button class="btn btn-secondary" data-role="leider">Ik ben gespreksleider</button>
    </div>
    <div id="nameEntry" class="hidden">
      <input id="nameInput" type="text" placeholder="Jouw voornaam" maxlength="20" autocomplete="off">
      <button class="btn btn-primary" id="joinBtn">Doe mee →</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="app-header">
    <div class="logo">Respect</div>
    <div id="screenTitle"></div>
    <div id="participantCount" class="pill">👥 1</div>
  </header>

  <main id="screensContainer"></main>

  <nav id="leaderBar" class="leader-bar hidden">
    <div class="leader-row">
      <button id="prevBtn">← Vorige</button>
      <select id="screenSelect"></select>
      <button id="nextBtn">Volgende →</button>
      <button id="resetBtn" class="danger">Reset</button>
    </div>
    <div class="leader-row hidden" id="photoControls">
      <button id="prevPhotoBtn">◀ Vorige foto</button>
      <span class="counter" id="photoCounter">1/5</span>
      <button id="nextPhotoBtn">Volgende foto ▶</button>
    </div>
  </nav>
</div>

<div id="toast"></div>

<script type="module">
// =====================================================
//  FIREBASE
// =====================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, set, push, onValue, onChildAdded, remove, onDisconnect, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDBMeg_s2f7V3nUA9d0CV0Vc_ytYz0ycs",
  authDomain: "jezusendeman.firebaseapp.com",
  databaseURL: "https://jezusendeman-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jezusendeman",
  storageBucket: "jezusendeman.firebasestorage.app",
  messagingSenderId: "196835530316",
  appId: "1:196835530316:web:629233a75171950b2a86e9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =====================================================
//  STATE
// =====================================================
let uid = sessionStorage.getItem('uid');
if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('uid', uid); }

let userName = sessionStorage.getItem('name') || '';
let isLeader = sessionStorage.getItem('role') === 'leider';
let currentScreenId = 'tandpasta';
let currentPhotoIdx = 0;

//  CONTENT

  {

  { id: 'binnenkomer', label: '📸 Eerste indruk' },
  { id: 'bijbel', label: '📖 Bijbeltekst' },
  { id: 'gesprek', label: '💬 Gesprek' },
  { id: 'denkduwtjes', label: '🤔 Denkduwtjes' },
  { id: 'bidden', label: '🎵 Zingen & bidden' },
  { id: 'einde', label: '✨ Afsluiting' }
];

// =====================================================
//  DOM
// =====================================================
const $ = (s) => document.querySelector(s);
const loginScreen = $('#login');
const appEl = $('#app');
const screensContainer = $('#screensContainer');
const screenTitle = $('#screenTitle');
const participantCount = $('#participantCount');
const leaderBar = $('#leaderBar');
const screenSelect = $('#screenSelect');
const photoControls = $('#photoControls');
const photoCounter = $('#photoCounter');
const toast = $('#toast');

// =====================================================
//  LOGIN
// =====================================================
document.querySelectorAll('[data-role]').forEach(btn => {
  btn.addEventListener('click', () => {
    const role = btn.dataset.role;
    if (role === 'leider') {
      isLeader = true;
      userName = 'Leider';
      sessionStorage.setItem('role', 'leider');
      sessionStorage.setItem('name', userName);
      startApp();
    } else {
      $('#roleChoice').classList.add('hidden');
      $('#nameEntry').classList.remove('hidden');
      $('#nameInput').focus();
    }
  });
});

$('#joinBtn').addEventListener('click', joinAsParticipant);
$('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinAsParticipant(); });

function joinAsParticipant() {
  const name = $('#nameInput').value.trim();
  if (name.length < 1) { showToast('Vul je voornaam in'); return; }
  userName = name;
  isLeader = false;
  sessionStorage.setItem('name', name);
  sessionStorage.setItem('role', 'deelnemer');
  startApp();
}

// =====================================================
//  START
// =====================================================
function startApp() {
  loginScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  if (isLeader) {
    document.body.classList.add('is-leader');
    leaderBar.classList.remove('hidden');
  }

  buildAllScreens();
  buildLeaderSelect();
  bindLeaderControls();
  setupFirebaseListeners();
  registerParticipant();
  listenParticipantCount();
}

// =====================================================
//  BUILD SCREENS
// =====================================================
function buildAllScreens() {
  SCREENS.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'screen' + (idx === 0 ? '' : ' hidden');
    div.dataset.screenId = s.id;
    div.innerHTML = renderScreen(s.id);
    screensContainer.appendChild(div);
  });
  updateHeaderTitle('tandpasta');
  bindSubmitHandlers();
  bindRevealHandlers();
}

function renderScreen(id) {
  switch (id) {
    case 'tandpasta': return renderTandpasta();
    case 'welcome': return renderWelcome();
    case 'binnenkomer': return renderBinnenkomer();
    case 'bijbel': return renderBijbel();
    case 'gesprek': return renderQuestions('gesprek', '💬 Met elkaar in gesprek', 'Deel je gedachten. Er zijn geen foute antwoorden — we leren van elkaar.');
    case 'denkduwtjes': return renderQuestions('denkduwtjes', '🤔 Denkduwtjes', 'Even eerlijk naar jezelf kijken. Wat zou jij willen veranderen?');
    case 'bidden': return renderBidden();
    case 'einde': return renderEinde();
  }
  return '';
}

}

// =====================================================
//  SCREEN NAVIGATIE
// =====================================================
function buildLeaderSelect() {
  SCREENS.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.label;
    screenSelect.appendChild(opt);
  });
  screenSelect.value = 'tandpasta';
}

function bindLeaderControls() {
  if (!isLeader) return;

  $('#prevBtn').addEventListener('click', () => {
    const i = SCREENS.findIndex(s => s.id === currentScreenId);
    if (i > 0) setCurrentScreen(SCREENS[i - 1].id);
  });
  $('#nextBtn').addEventListener('click', () => {
    const i = SCREENS.findIndex(s => s.id === currentScreenId);
    if (i < SCREENS.length - 1) setCurrentScreen(SCREENS[i + 1].id);
  });
  screenSelect.addEventListener('change', (e) => setCurrentScreen(e.target.value));

  $('#prevPhotoBtn').addEventListener('click', () => {
    if (currentPhotoIdx > 0) set(ref(db, 'session/currentPhoto'), currentPhotoIdx - 1);
  });
  $('#nextPhotoBtn').addEventListener('click', () => {
    if (currentPhotoIdx < PHOTOS.length - 1) set(ref(db, 'session/currentPhoto'), currentPhotoIdx + 1);
  });

  $('#resetBtn').addEventListener('click', async () => {
    if (!confirm('Weet je zeker dat je ALLE antwoorden en deelnemers wilt verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
    await remove(ref(db, 'session/responses'));
    await remove(ref(db, 'session/revealed'));
    await remove(ref(db, 'session/participants'));
    document.querySelectorAll('.q-feed').forEach(f => {
      f.innerHTML = '<div class="feed-empty">Nog geen antwoorden...</div>';
    });
    showToast('Alles is gereset ✓');
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('hidden', el.dataset.screenId !== id);
  });
  updateHeaderTitle(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (isLeader) screenSelect.value = id;
  currentScreenId = id;

  if (isLeader) {
    photoControls.classList.toggle('hidden', id !== 'binnenkomer');
  }
}

function updateHeaderTitle(id) {
  const s = SCREENS.find(x => x.id === id);
  screenTitle.textContent = s ? s.label.replace(/^[^\s]+\s/, '') : '';
}

function setCurrentScreen(id) {
  set(ref(db, 'session/currentScreen'), id);
  if (id === 'binnenkomer') {
    set(ref(db, 'session/currentPhoto'), 0);
  }
}

function showPhotoSlide(idx) {
  document.querySelectorAll('[data-photo-slide]').forEach((el, i) => {
    el.classList.toggle('hidden', i !== idx);
  });
  document.querySelectorAll('.photo-dots').forEach(dots => {
    dots.querySelectorAll('.dot').forEach((d, j) => {
      d.classList.toggle('active', j === idx);
    });
  });
  currentPhotoIdx = idx;
  if (photoCounter) photoCounter.textContent = `${idx + 1}/${PHOTOS.length}`;
}

// =====================================================
//  FIREBASE LISTENERS
// =====================================================
function setupFirebaseListeners() {
  onValue(ref(db, 'session/currentScreen'), (snap) => {
    const id = snap.val();
    if (id && SCREENS.some(s => s.id === id)) showScreen(id);
  });

  onValue(ref(db, 'session/currentPhoto'), (snap) => {
    const idx = snap.val() ?? 0;
    showPhotoSlide(Math.max(0, Math.min(PHOTOS.length - 1, idx)));
  });

  onValue(ref(db, 'session/revealed'), (snap) => {
    const data = snap.val() || {};
    PHOTOS.forEach(p => {
      const card = document.querySelector(`[data-photo="${p.id}"]`);
      if (card) card.classList.toggle('revealed', !!data[p.id]);
    });
  });

  const allQuestions = [
    { id: 'video-reactie' },
    { id: 'gebedspunten' },
    ...PHOTOS.map(p => ({ id: 'foto-' + p.id })),
    ...QUESTIONS.gesprek,
    ...QUESTIONS.denkduwtjes
  ];

  allQuestions.forEach(q => {
    const feedEl = document.querySelector(`[data-feed="${q.id}"]`);
    if (!feedEl) return;
    feedEl.innerHTML = '<div class="feed-empty">Nog geen antwoorden...</div>';
    const qRef = query(ref(db, `session/responses/${q.id}`), limitToLast(200));
    onChildAdded(qRef, (snap) => {
      const data = snap.val();
      if (!data) return;
      const empty = feedEl.querySelector('.feed-empty');
      if (empty) empty.remove();
      const item = document.createElement('div');
      const isGebed = q.id === 'gebedspunten';
      item.className = 'feed-item' + (isGebed ? ' no-name' : '') + (data.uid === uid ? ' mine' : '');
      item.innerHTML = isGebed
        ? `<div class="feed-text">${escapeHtml(data.text || '')}</div>`
        : `<div class="feed-name">${escapeHtml(data.name || '?')}</div>
           <div class="feed-text">${escapeHtml(data.text || '')}</div>`;
      feedEl.appendChild(item);
      feedEl.scrollTop = feedEl.scrollHeight;
    });
  });
}

// =====================================================
//  SUBMIT HANDLERS
// =====================================================
function bindSubmitHandlers() {
  document.querySelectorAll('.q-block').forEach(block => {
    const qid = block.dataset.qid;
    const input = block.querySelector('input');
    const btn = block.querySelector('.q-send');
    if (!input || !btn) return;

    const submit = async () => {
      const text = input.value.trim();
      if (!text) return;
      const itemRef = push(ref(db, `session/responses/${qid}`));
      await set(itemRef, {
        uid: uid,
        name: userName,
        text: text,
        ts: Date.now()
      });
      input.value = '';
      input.focus();
    };

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  });
}

function bindRevealHandlers() {
  if (!isLeader) return;
  document.querySelectorAll('[data-reveal]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.reveal;
      set(ref(db, `session/revealed/${id}`), true);
    });
  });
}

// =====================================================
//  DEELNEMERS
// =====================================================
function registerParticipant() {
  const pRef = ref(db, `session/participants/${uid}`);
  set(pRef, { name: userName, role: isLeader ? 'leider' : 'deelnemer', ts: Date.now() });
  onDisconnect(pRef).remove();
  window.addEventListener('beforeunload', () => { remove(pRef); });
}

function listenParticipantCount() {
  onValue(ref(db, 'session/participants'), (snap) => {
    const data = snap.val() || {};
    const n = Object.values(data).filter(p => p.role !== 'leider').length;
    participantCount.textContent = `👥 ${n}`;
  });
}

// =====================================================
//  HELPERS
// =====================================================
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// =====================================================
//  AUTO-LOGIN
// =====================================================
if (userName && sessionStorage.getItem('role')) {
  isLeader = sessionStorage.getItem('role') === 'leider';
  startApp();
}
</script>
