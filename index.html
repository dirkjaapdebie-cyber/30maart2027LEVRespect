<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Respect • Tieneravond</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
    background: #0a0a16;
    color: #ececf5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,.25), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(255,92,168,.18), transparent 45%);
    pointer-events: none; z-index: 0;
  }

  /* ============ ALGEMEEN ============ */
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select { font-family: inherit; }

  /* ============ LOGIN ============ */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 100;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: rgba(26,26,46,.85);
    border: 1px solid rgba(124,92,255,.35);
    border-radius: 24px;
    padding: 40px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 60px rgba(124,92,255,.15);
    text-align: center;
    animation: cardIn .5s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  .login-card h1 {
    font-size: 44px; font-weight: 900; letter-spacing: -2px;
    background: linear-gradient(135deg, #7c5cff 0%, #ff5ca8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .login-card .sub { color: #8888a8; font-size: 14px; margin-bottom: 32px; }
  .btn {
    display: block; width: 100%;
    padding: 16px; border-radius: 14px;
    font-size: 16px; font-weight: 700;
    transition: transform .15s, box-shadow .15s, background .15s;
    margin-bottom: 12px;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white;
    box-shadow: 0 8px 24px rgba(124,92,255,.4);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(124,92,255,.55); }
  .btn-secondary {
    background: rgba(255,255,255,.06);
    color: #ececf5;
    border: 1px solid rgba(255,255,255,.12);
  }
  .btn-secondary:hover { background: rgba(255,255,255,.1); }
  #nameInput {
    width: 100%; padding: 16px;
    background: rgba(0,0,0,.35);
    border: 2px solid rgba(124,92,255,.3);
    border-radius: 14px;
    color: white; font-size: 18px; font-weight: 600;
    text-align: center; margin-bottom: 12px;
    outline: none; transition: border .2s;
  }
  #nameInput:focus { border-color: #7c5cff; }
  #nameInput::placeholder { color: #55557a; font-weight: 400; }

  /* ============ APP LAYOUT ============ */
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1; }
  .app-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: rgba(10,10,22,.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(124,92,255,.15);
    gap: 12px;
  }
  .logo {
    font-weight: 900; letter-spacing: -1px; font-size: 18px;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #screenTitle { font-size: 13px; color: #8888a8; font-weight: 600; flex: 1; text-align: center; }
  .pill {
    background: rgba(124,92,255,.18);
    border: 1px solid rgba(124,92,255,.35);
    color: #b8a8ff;
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    white-space: nowrap;
  }

  main {
    flex: 1;
    padding: 24px 18px 120px;
    max-width: 900px; margin: 0 auto; width: 100%;
  }

  /* ============ HERO / WELKOM ============ */
  .hero { text-align: center; padding: 40px 0 20px; animation: fadeUp .6s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: none; }
  }
  .hero-title {
    font-size: clamp(56px, 14vw, 110px);
    font-weight: 900; letter-spacing: -4px; line-height: .9;
    background: linear-gradient(135deg, #7c5cff 0%, #ff5ca8 60%, #ffb85c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .hero-sub {
    font-size: clamp(16px, 4vw, 22px);
    color: #b8a8ff; font-weight: 700; margin-bottom: 32px; letter-spacing: -.3px;
  }
  .hero-text {
    font-size: 17px; line-height: 1.65; color: #c8c8dc;
    max-width: 560px; margin: 0 auto 20px;
  }
  .hero-hint {
    display: inline-block;
    background: rgba(124,92,255,.12);
    border: 1px solid rgba(124,92,255,.3);
    padding: 14px 20px; border-radius: 16px;
    font-size: 14px; color: #b8a8ff; line-height: 1.5;
    margin-top: 20px; max-width: 460px;
  }

  /* ============ SCHERM KOP ============ */
  .screen-h {
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 900; letter-spacing: -1.5px;
    margin-bottom: 10px; line-height: 1.1;
  }
  .screen-h em {
    font-style: normal;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .screen-intro {
    font-size: 16px; line-height: 1.6; color: #a8a8c0;
    margin-bottom: 28px; max-width: 640px;
  }

  /* ============ FOTO KAARTEN ============ */
  .photo-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  @media (min-width: 640px) { .photo-grid { grid-template-columns: 1fr 1fr; } }
  .photo-card {
    background: rgba(26,26,46,.7);
    border: 1px solid rgba(124,92,255,.2);
    border-radius: 20px;
    overflow: hidden;
    animation: fadeUp .5s ease;
    transition: border-color .2s;
  }
  .photo-card.revealed { border-color: rgba(124,92,255,.6); }
  .photo-wrap {
    position: relative; aspect-ratio: 1/1;
    background: linear-gradient(135deg, #1a1a2e, #2a1a4e);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-fallback {
    font-size: 90px; font-weight: 900; color: rgba(124,92,255,.35);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-wrap img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  .photo-name {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,.95), transparent);
    padding: 30px 16px 12px;
    font-weight: 800; font-size: 17px; color: #fff;
    opacity: 0; transition: opacity .3s;
  }
  .photo-card.revealed .photo-name { opacity: 1; }
  .photo-info {
    padding: 12px 16px; font-size: 13px; color: #a8a8c0; line-height: 1.5;
    border-bottom: 1px solid rgba(124,92,255,.15);
  }
  .photo-card:not(.revealed) .photo-info { display: none; }
  .leader-reveal-hint {
    display: block; text-align: center; font-size: 11px; color: #7c5cff;
    padding: 8px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    cursor: pointer; background: rgba(124,92,255,.08);
  }
  body:not(.is-leader) .leader-reveal-hint { display: none; }

  /* ============ BIJBELTEKST ============ */
  .bible-card {
    background: linear-gradient(180deg, rgba(26,26,46,.9), rgba(20,20,38,.9));
    border: 1px solid rgba(124,92,255,.25);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .bible-card::before {
    content: "✝";
    position: absolute; top: -30px; right: -10px;
    font-size: 200px; color: rgba(124,92,255,.06);
    font-weight: 900;
  }
  .bible-ref {
    display: inline-block;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white; font-weight: 800; font-size: 13px;
    padding: 6px 14px; border-radius: 999px;
    margin-bottom: 18px; letter-spacing: .3px;
  }
  .bible-text {
    font-size: 17px; line-height: 1.85; color: #d8d8e8;
    position: relative; z-index: 1;
    max-height: 55vh; overflow-y: auto;
    padding-right: 12px;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,92,255,.4) transparent;
  }
  .bible-text::-webkit-scrollbar { width: 6px; }
  .bible-text::-webkit-scrollbar-thumb { background: rgba(124,92,255,.4); border-radius: 3px; }
  .bible-text p { margin-bottom: 14px; }
  .bible-text .verse-num {
    display: inline-block;
    color: #7c5cff; font-weight: 900; font-size: 13px;
    vertical-align: super; margin-right: 6px;
  }
  .bible-highlight {
    background: linear-gradient(90deg, rgba(124,92,255,.2), rgba(255,92,168,.1));
    border-left: 3px solid #7c5cff;
    padding: 10px 14px; margin: 14px 0; border-radius: 0 10px 10px 0;
    font-weight: 600; color: #fff;
  }

  /* ============ VRAAG BLOKKEN ============ */
  .q-block {
    background: rgba(26,26,46,.65);
    border: 1px solid rgba(124,92,255,.18);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 18px;
    animation: fadeUp .5s ease;
  }
  .q-header {
    display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start;
  }
  .q-num {
    flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 15px; color: white;
  }
  .q-text {
    font-size: 16px; line-height: 1.5; font-weight: 600; color: #ececf5;
    padding-top: 4px;
  }
  .q-input-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .q-input-row input {
    flex: 1; min-width: 0;
    padding: 14px 16px;
    background: rgba(0,0,0,.4);
    border: 2px solid rgba(124,92,255,.2);
    border-radius: 14px;
    color: white; font-size: 15px;
    outline: none;
    transition: border .2s;
  }
  .q-input-row input:focus { border-color: #7c5cff; }
  .q-input-row input::placeholder { color: #55557a; }
  .q-send {
    background: linear-gradient(135deg, #7c5cff, #ff5ca8);
    color: white; border-radius: 14px;
    padding: 0 20px; font-size: 20px; font-weight: 900;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 4px 16px rgba(124,92,255,.3);
  }
  .q-send:active { transform: scale(.93); }
  .q-feed {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 300px; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(124,92,255,.3) transparent;
  }
  .q-feed::-webkit-scrollbar { width: 5px; }
  .q-feed::-webkit-scrollbar-thumb { background: rgba(124,92,255,.3); border-radius: 3px; }
  .feed-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(124,92,255,.08);
    border: 1px solid rgba(124,92,255,.15);
    border-radius: 12px;
    padding: 10px 12px;
    animation: itemIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes itemIn {
    from { opacity: 0; transform: translateY(-8px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  .feed-name {
    flex-shrink: 0;
    font-weight: 800; font-size: 13px; color: #b8a8ff;
    min-width: 52px;
  }
  .feed-name::after { content: ":"; color: #7c5cff; margin-right: 2px; }
  .feed-text { font-size: 14px; line-height: 1.45; color: #d8d8e8; flex: 1; word-break: break-word; }
  .feed-empty { font-size: 13px; color: #55557a; font-style: italic; padding: 6px 2px; }
  .feed-item.mine { background: rgba(255,92,168,.1); border-color: rgba(255,92,168,.3); }
  .feed-item.mine .feed-name { color: #ff8ec0; }

  /* ============ LIEDJES / BIDDEN ============ */
  .list-card {
    background: rgba(26,26,46,.65);
    border: 1px solid rgba(124,92,255,.18);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .list-card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    color: #7c5cff; font-weight: 800; margin-bottom: 14px;
  }
  .list-card ul { list-style: none; }
  .list-card li {
    padding: 10px 0; border-bottom: 1px solid rgba(124,92,255,.1);
    font-size: 15px; color: #d8d8e8;
  }
  .list-card li:last-child { border-bottom: none; }
  .list-card p { font-size: 15px; line-height: 1.65; color: #c8c8dc; }

  /* ============ LEADER BAR ============ */
  .leader-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: rgba(10,10,22,.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(124,92,255,.3);
    box-shadow: 0 -8px 32px rgba(0,0,0,.5);
  }
  .leader-bar button, .leader-bar select {
    background: rgba(124,92,255,.15);
    border: 1px solid rgba(124,92,255,.3);
    color: #d8d8e8;
    padding: 10px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 700;
    transition: background .15s;
  }
  .leader-bar button:hover, .leader-bar select:hover { background: rgba(124,92,255,.28); }
  .leader-bar button:disabled { opacity: .35; cursor: not-allowed; }
  .leader-bar select { flex: 1; min-width: 0; }
  .leader-bar .danger {
    background: rgba(239,68,68,.15);
    border-color: rgba(239,68,68,.4);
    color: #ff8888;
  }
  .leader-bar .danger:hover { background: rgba(239,68,68,.3); }

  /* ============ TOAST ============ */
  #toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(124,92,255,.95);
    color: white; font-weight: 700; font-size: 14px;
    padding: 12px 22px; border-radius: 999px;
    box-shadow: 0 8px 32px rgba(124,92,255,.5);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ============ MOBIEL ============ */
  @media (max-width: 500px) {
    main { padding: 18px 14px 130px; }
    .app-header { padding: 10px 14px; }
    #screenTitle { display: none; }
    .q-block { padding: 16px; }
    .bible-card { padding: 18px; }
    .bible-text { font-size: 16px; line-height: 1.75; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <h1>RESPECT</h1>
    <p class="sub">Tieneravond • Jakobus 3:5–12</p>
    <div id="roleChoice">
      <button class="btn btn-primary" data-role="deelnemer">Ik doe mee als deelnemer</button>
      <button class="btn btn-secondary" data-role="leider">Ik ben gespreksleider</button>
    </div>
    <div id="nameEntry" class="hidden">
      <input id="nameInput" type="text" placeholder="Jouw voornaam" maxlength="20" autocomplete="off">
      <button class="btn btn-primary" id="joinBtn">Doe mee →</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="app-header">
    <div class="logo">RESPECT</div>
    <div id="screenTitle"></div>
    <div id="participantCount" class="pill">👥 1</div>
  </header>

  <main id="screensContainer"></main>

  <nav id="leaderBar" class="leader-bar hidden">
    <button id="prevBtn">← Vorige</button>
    <select id="screenSelect"></select>
    <button id="nextBtn">Volgende →</button>
    <button id="resetBtn" class="danger">Reset</button>
  </nav>
</div>

<div id="toast"></div>

<script type="module">
// =====================================================
//  FIREBASE
// =====================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, set, push, onValue, onChildAdded, remove, onDisconnect, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDBMeg_s2f7V3nUA9d0CV0Vc_ytYz0ycs",
  authDomain: "jezusendeman.firebaseapp.com",
  databaseURL: "https://jezusendeman-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "jezusendeman",
  storageBucket: "jezusendeman.firebasestorage.app",
  messagingSenderId: "196835530316",
  appId: "1:196835530316:web:629233a75171950b2a86e9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =====================================================
//  STATE
// =====================================================
let uid = sessionStorage.getItem('uid');
if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('uid', uid); }

let userName = sessionStorage.getItem('name') || '';
let isLeader = sessionStorage.getItem('role') === 'leider';
let currentScreenId = 'welcome';

// =====================================================
//  CONTENT CONFIG
// =====================================================

const PHOTOS = [
  {
    id: 'p1', name: 'Mahatma Gandhi',
    info: 'Indiase vrijheidsstrijder. Kwam geweldloos op voor de onafhankelijkheid van India.',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7a/Mahatma-Gandhi%2C_studio%2C_1931.jpg/440px-Mahatma-Gandhi%2C_studio%2C_1931.jpg'
  },
  {
    id: 'p2', name: 'Mikhail Kalashnikov',
    info: 'Russische wapenontwerper. Bedacht het bekende AK-47 geweer.',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Mikhail_Kalashnikov_2009.jpg/440px-Mikhail_Kalashnikov_2009.jpg'
  },
  {
    id: 'p3', name: 'Aletta Jacobs',
    info: 'Een van de eerste vrouwelijke artsen in Nederland en voorvechtster van vrouwenstemrecht.',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Aletta_Jacobs_%281854-1929%29.jpg/440px-Aletta_Jacobs_%281854-1929%29.jpg'
  },
  {
    id: 'p4', name: 'Madeline Stuart',
    info: 'Een van de eerste modellen met het syndroom van Down. Doorbrak internationale modewereld.',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Madeline_Stuart_2015.jpg/440px-Madeline_Stuart_2015.jpg'
  },
  {
    id: 'p5', name: 'Boyan Slat',
    info: 'Bedacht als profielwerkstuk een systeem om de oceaan plasticvrij te maken. Oprichter van The Ocean Cleanup.',
    img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/Boyan_Slat_2017.jpg/440px-Boyan_Slat_2017.jpg'
  }
];

const QUESTIONS = {
  gesprek: [
    { id: 'g1', text: 'Wat valt je op in deze tekst? Welk vers raakt je het meest?' },
    { id: 'g2', text: 'Jakobus vergelijkt de tong met een klein vuurtje dat een heel bos in brand steekt. Herken je dat? Geef een voorbeeld uit je eigen leven.' },
    { id: 'g3', text: 'Hoe kun je met woorden iemand opbouwen in plaats van afbreken? Noem één concreet idee.' },
    { id: 'g4', text: 'Waar zie jij respectloos gedrag om je heen? Op school, op de club, online, in de kerk?' }
  ],
  denkduwtjes: [
    { id: 'd1', text: 'Wat was de laatste keer dat jij het idee had dat iemand je niet respectvol behandelde?' },
    { id: 'd2', text: 'Hoe zou jij "respect" in één zin samenvatten?' },
    { id: 'd3', text: 'Met welke groep mensen heb jij moeite als het om respect gaat? Wees eerlijk.' }
  ]
};

const SCREENS = [
  { id: 'welcome', label: '🏠 Welkom' },
  { id: 'binnenkomer', label: '📸 Eerste indruk' },
  { id: 'bijbel', label: '📖 Bijbeltekst' },
  { id: 'gesprek', label: '💬 Gesprek' },
  { id: 'denkduwtjes', label: '🤔 Denkduwtjes' },
  { id: 'bidden', label: '🎵 Zingen & bidden' },
  { id: 'einde', label: '✨ Afsluiting' }
];

// =====================================================
//  DOM
// =====================================================
const $ = (s) => document.querySelector(s);
const loginScreen = $('#login');
const appEl = $('#app');
const screensContainer = $('#screensContainer');
const screenTitle = $('#screenTitle');
const participantCount = $('#participantCount');
const leaderBar = $('#leaderBar');
const screenSelect = $('#screenSelect');
const toast = $('#toast');

// =====================================================
//  LOGIN FLOW
// =====================================================
document.querySelectorAll('[data-role]').forEach(btn => {
  btn.addEventListener('click', () => {
    const role = btn.dataset.role;
    if (role === 'leider') {
      isLeader = true;
      userName = 'Leider';
      sessionStorage.setItem('role', 'leider');
      sessionStorage.setItem('name', userName);
      startApp();
    } else {
      $('#roleChoice').classList.add('hidden');
      $('#nameEntry').classList.remove('hidden');
      $('#nameInput').focus();
    }
  });
});

$('#joinBtn').addEventListener('click', joinAsParticipant);
$('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinAsParticipant(); });

function joinAsParticipant() {
  const name = $('#nameInput').value.trim();
  if (name.length < 1) { showToast('Vul je voornaam in'); return; }
  userName = name;
  isLeader = false;
  sessionStorage.setItem('name', name);
  sessionStorage.setItem('role', 'deelnemer');
  startApp();
}

// =====================================================
//  START APP
// =====================================================
function startApp() {
  loginScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  if (isLeader) {
    document.body.classList.add('is-leader');
    leaderBar.classList.remove('hidden');
  }

  buildAllScreens();
  buildLeaderSelect();
  setupFirebaseListeners();
  registerParticipant();
  listenScreenChanges();
  listenParticipantCount();
}

// =====================================================
//  BUILD SCREENS
// =====================================================
function buildAllScreens() {
  SCREENS.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'screen' + (idx === 0 ? '' : ' hidden');
    div.dataset.screenId = s.id;
    div.innerHTML = renderScreen(s.id);
    screensContainer.appendChild(div);
  });
  updateHeaderTitle('welcome');
}

function renderScreen(id) {
  switch (id) {
    case 'welcome': return renderWelcome();
    case 'binnenkomer': return renderBinnenkomer();
    case 'bijbel': return renderBijbel();
    case 'gesprek': return renderQuestions('gesprek', '💬 Met elkaar in gesprek', 'Deel je gedachten. Er zijn geen foute antwoorden — we leren van elkaar.');
    case 'denkduwtjes': return renderQuestions('denkduwtjes', '🤔 Denkduwtjes', 'Even eerlijk naar jezelf kijken. Wat zou jij willen veranderen?');
    case 'bidden': return renderBidden();
    case 'einde': return renderEinde();
  }
  return '';
}

function renderWelcome() {
  return `
    <div class="hero">
      <div class="hero-title">RESPECT</div>
      <div class="hero-sub">Wie ben ik voor anderen?</div>
      <p class="hero-text">Elk mens is geschapen naar Gods beeld — en verdient dus respect. Maar hoe doe je dat in de praktijk? Op het schoolplein, op de club, online?</p>
      <p class="hero-text">Vanavond ontdekken we wat Jakobus 3 ons hierover te zeggen heeft.</p>
      <div class="hero-hint">📱 Pak je telefoon erbij. Op elk scherm kun je antwoorden insturen — ze verschijnen direct bij iedereen.</div>
    </div>
  `;
}

function renderBinnenkomer() {
  return `
    <h2 class="screen-h">Eerste <em>indruk</em></h2>
    <p class="screen-intro">Je eerste indruk van iemand zegt vaak meer over jou dan over de ander. Kijk naar de foto's en deel je eerste gedachte. Wie denk je dat dit is? Wat voor iemand lijkt het?</p>
    <div class="photo-grid">
      ${PHOTOS.map(p => `
        <div class="photo-card" data-photo="${p.id}">
          <div class="photo-wrap" data-photo-img="${p.id}">
            <div class="photo-fallback">?</div>

            <div class="photo-name">${p.name}</div>
          </div>
          <div class="photo-info">${p.info}</div>
          ${isLeader ? `<div class="leader-reveal-hint" data-reveal="${p.id}">Klik om te onthullen</div>` : ''}

      <div class="q-header">

      </div>
      <div class="q-input-row">
        <input type="text" placeholder="Typ je antwoord..." autocomplete="off">
        <button class="q-send">➤</button>

function renderBijbel() {
  return `
    <h2 class="screen-h">Jakobus <em>3:5–12</em></h2>
    <p class="screen-intro">Lees mee. Scroll door de tekst. Wat raakt je?</p>

      <span class="bible-ref">Jakobus 3:5–12 (BGT)</span>
      <div class="bible-text">
        <p><span class="verse-num">5</span>Zo is het ook met de tong. Het is maar een klein deel van ons lichaam, maar het kan grote dingen teweegbrengen. Een klein vuurtje kan een groot bos in brand steken.</p>
        <p><span class="verse-num">6</span>De tong is als een vuur. Hij hoort bij ons lichaam en kan ons hele leven besmetten. Hij kan ons hele leven in brand zetten, met vuur dat uit de hel komt.</p>
        <p><span class="verse-num">7</span>Alle soorten wilde dieren, vogels, kruipende dieren en vissen worden door mensen getemd, en dat is ook gelukt.</p>

        <p><span class="verse-num">9</span>Met onze tong prijzen we de Heer en Vader, en met onze tong vervloeken we de mensen die op God lijken.</p>

        <p><span class="verse-num">11</span>Kan een bron uit dezelfde opening zoet en bitter water laten opborrelen?</p>
        <p><span class="verse-num">12</span>Kan een vijgenboom olijven geven, of een wijnstok vijgen? Nee. En een zoute bron kan geen zoet water geven.</p>
      </div>
    </div>
    <div class="list-card">
      <h3>Even terug</h3>
      <p>Jakobus zegt: <strong>elk mens is gemaakt naar het beeld van God</strong>. Als je iemand respectloos behandelt, doe je dus ook God tekort. Daarom gaat respect verder dan 'aardig doen' — het gaat om wie de ander écht is in Gods ogen.</p>

function renderQuestions(key, title, intro) {
  const qs = QUESTIONS[key];
  return `
    <h2 class="screen-h">${title.split(' ')[0]} <em>${title.split(' ').slice(1).join(' ')}</em></h2>
    <p class="screen-intro">${intro}</p>
    ${qs.map((q, i) => `
      <div class="q-block" data-qid="${q.id}">
        <div class="q-header">
          <div class="q-num">${i + 1}</div>
          <div class="q-text">${q.text}</div>
        </div>
        <div class="q-input-row">
          <input type="text" placeholder="Jouw antwoord..." autocomplete="off">
          <button class="q-send">➤</button>
        </div>
        <div class="q-feed" data-feed="${q.id}"></div>
      </div>
    `).join('')}
  `;
}

function renderBidden() {
  return `
    <h2 class="screen-h">Zingen & <em>bidden</em></h2>
    <p class="screen-intro">We sluiten samen af. Zing mee en bid mee.</p>
    <div class="list-card">
      <h3>🎵 Liederen</h3>
      <ul>
        <li>OTH 362 – U maakt ons één</li>
        <li>OTH 371 – Dit is mijn gebod</li>
        <li>OTH 374 – Ik wil jou van harte dienen</li>
        <li>Psalm 15:2 & 3</li>
      </ul>
    </div>
    <div class="list-card">
      <h3>🙏 Gebed</h3>
      <p>Dank God dat Hij ieder van ons waardevol vindt en dat we naar Zijn beeld geschapen zijn.</p>
      <p style="margin-top:12px">Bid om wijsheid om hier op een goede manier mee om te gaan — door respect te uiten naar de mensen om ons heen, die óók naar Gods beeld geschapen zijn.</p>
    </div>

function renderEinde() {
  return `
    <div class="hero">
      <div class="hero-title" style="font-size:clamp(36px,10vw,80px)">Amen.</div>
      <div class="hero-sub">Neem het mee deze week.</div>
      <p class="hero-text">Denk aan één iemand waar jij deze week bewust respect aan wilt tonen. Iemand die je normaal gesproken zou overslaan. Iemand die naar Gods beeld gemaakt is — net als jij.</p>
      <div class="hero-hint">💜 Bedankt voor het meedoen!</div>
    </div>

// =====================================================
//  SCREEN NAVIGATION
// =====================================================
function buildLeaderSelect() {
  SCREENS.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.label;
    screenSelect.appendChild(opt);
  });
  screenSelect.value = 'welcome';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('hidden', el.dataset.screenId !== id);
  });
  updateHeaderTitle(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (isLeader) screenSelect.value = id;
  currentScreenId = id;
}

function updateHeaderTitle(id) {
  const s = SCREENS.find(x => x.id === id);
  screenTitle.textContent = s ? s.label.replace(/^[^\s]+\s/, '') : '';
}

// Leader controls
$('#prevBtn').addEventListener('click', () => {
  const i = SCREENS.findIndex(s => s.id === currentScreenId);
  if (i > 0) setCurrentScreen(SCREENS[i - 1].id);
});
$('#nextBtn').addEventListener('click', () => {
  const i = SCREENS.findIndex(s => s.id === currentScreenId);
  if (i < SCREENS.length - 1) setCurrentScreen(SCREENS[i + 1].id);
});
screenSelect.addEventListener('change', (e) => setCurrentScreen(e.target.value));

function setCurrentScreen(id) {
  set(ref(db, 'session/currentScreen'), id);
}

// =====================================================
//  FIREBASE LISTENERS
// =====================================================
function setupFirebaseListeners() {
  // Current screen (everyone follows leader)
  onValue(ref(db, 'session/currentScreen'), (snap) => {
    const id = snap.val();
    if (id && SCREENS.some(s => s.id === id)) {
      showScreen(id);
    }
  });

  // Photo reveals
  onValue(ref(db, 'session/revealed'), (snap) => {
    const data = snap.val() || {};
    PHOTOS.forEach(p => {
      const card = document.querySelector(`[data-photo="${p.id}"]`);
      if (card) card.classList.toggle('revealed', !!data[p.id]);
    });
  });

  // Question feeds — per vraag één listener, alleen append (input blijft onaangeroerd)
  const allQuestions = [
    { id: 'foto-reactie' },
    ...QUESTIONS.gesprek,
    ...QUESTIONS.denkduwtjes
  ];

  allQuestions.forEach(q => {
    const feedEl = document.querySelector(`[data-feed="${q.id}"]`);
    if (!feedEl) return;
    feedEl.innerHTML = '<div class="feed-empty">Nog geen antwoorden...</div>';
    const qRef = query(ref(db, `session/responses/${q.id}`), limitToLast(200));
    onChildAdded(qRef, (snap) => {
      const data = snap.val();
      if (!data) return;
      const empty = feedEl.querySelector('.feed-empty');
      if (empty) empty.remove();
      const item = document.createElement('div');
      item.className = 'feed-item' + (data.uid === uid ? ' mine' : '');
      item.innerHTML = `
        <div class="feed-name">${escapeHtml(data.name || '?')}</div>
        <div class="feed-text">${escapeHtml(data.text || '')}</div>
      `;
      feedEl.appendChild(item);
      feedEl.scrollTop = feedEl.scrollHeight;
    });
  });

  // Leader: reset button
  if (isLeader) {
    $('#resetBtn').addEventListener('click', async () => {
      if (!confirm('Weet je zeker dat je ALLE antwoorden en deelnemers wilt verwijderen? Dit kan niet ongedaan gemaakt worden.')) return;
      await remove(ref(db, 'session/responses'));
      await remove(ref(db, 'session/revealed'));
      await remove(ref(db, 'session/participants'));
      document.querySelectorAll('.q-feed').forEach(f => {
        f.innerHTML = '<div class="feed-empty">Nog geen antwoorden...</div>';
      });
      showToast('Alles is gereset ✓');
    });
  }
}

// =====================================================
//  SUBMIT (met Enter én knop)
// =====================================================
function bindSubmitHandlers() {
  document.querySelectorAll('.q-block').forEach(block => {
    const qid = block.dataset.qid;
    const input = block.querySelector('input');
    const btn = block.querySelector('.q-send');
    if (!input || !btn) return;

    const submit = async () => {
      const text = input.value.trim();
      if (!text) return;
      const itemRef = push(ref(db, `session/responses/${qid}`));
      await set(itemRef, {
        uid: uid,
        name: userName,
        text: text,
        ts: Date.now()
      });
      input.value = '';
      input.focus();
    };

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  });
}

// Roep aan na bouwen screens
const origBuild = buildAllScreens;
buildAllScreens = function() {
  origBuild();
  bindSubmitHandlers();
  // Leader click op reveal-hint
  if (isLeader) {
    document.querySelectorAll('[data-reveal]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.dataset.reveal;
        set(ref(db, `session/revealed/${id}`), true);
      });
    });
  }
};

// =====================================================
//  REGISTER PARTICIPANT + COUNT
// =====================================================
function registerParticipant() {
  const pRef = ref(db, `session/participants/${uid}`);
  set(pRef, { name: userName, role: isLeader ? 'leider' : 'deelnemer', ts: Date.now() });
  onDisconnect(pRef).remove();
  window.addEventListener('beforeunload', () => { remove(pRef); });
}

function listenParticipantCount() {
  onValue(ref(db, 'session/participants'), (snap) => {
    const data = snap.val() || {};
    const n = Object.values(data).filter(p => p.role !== 'leider').length;
    participantCount.textContent = `👥 ${n}`;
  });
}

// =====================================================
//  HELPERS
// =====================================================
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// =====================================================
//  AUTO-LOGIN (bij refresh)
// =====================================================
if (userName && sessionStorage.getItem('role')) {
  isLeader = sessionStorage.getItem('role') === 'leider';
  startApp();
}
</script>
